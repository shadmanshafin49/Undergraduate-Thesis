    <text x="74" y="833" font-size="10.5" fill="#4B5563">DB-BOA &#183; every round</text>
    <line x1="210" y1="822" x2="222" y2="822" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="228" y="800" width="170" height="44" rx="6" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
    <circle cx="246" cy="822" r="10" fill="#6D28D9"/>
    <text x="246" y="826" text-anchor="middle" font-size="11" font-weight="bold" fill="white">2</text>
    <text x="262" y="818" font-size="11" font-weight="bold" fill="#111827">Hyperparam search</text>
    <text x="262" y="833" font-size="10.5" fill="#4B5563">DB-BOA &#183; at startup</text>
    <line x1="398" y1="822" x2="410" y2="822" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="416" y="800" width="170" height="44" rx="6" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
    <circle cx="434" cy="822" r="10" fill="#1D4ED8"/>
    <text x="434" y="826" text-anchor="middle" font-size="11" font-weight="bold" fill="white">3</text>
    <text x="450" y="818" font-size="11" font-weight="bold" fill="#111827">Local training</text>
    <text x="450" y="833" font-size="10.5" fill="#4B5563">ADTCN per bank</text>
    <line x1="586" y1="822" x2="598" y2="822" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="604" y="800" width="170" height="44" rx="6" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.2"/>
    <circle cx="622" cy="822" r="10" fill="#B45309"/>
    <text x="622" y="826" text-anchor="middle" font-size="11" font-weight="bold" fill="white">4</text>
    <text x="638" y="818" font-size="11" font-weight="bold" fill="#111827">Federated aggregation &#9733;</text>
    <text x="638" y="833" font-size="10.5" fill="#4B5563">DP&#183;Krum&#183;Shapley&#183;&#966;-DP</text>
    <line x1="774" y1="822" x2="786" y2="822" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="792" y="800" width="170" height="44" rx="6" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
    <circle cx="810" cy="822" r="10" fill="#15803D"/>
    <text x="810" y="826" text-anchor="middle" font-size="11" font-weight="bold" fill="white">5</text>
    <text x="826" y="818" font-size="11" font-weight="bold" fill="#111827">On-chain enforcement</text>
    <text x="826" y="833" font-size="10.5" fill="#4B5563">tokens &#183; audit records</text>
    <line x1="962" y1="822" x2="974" y2="822" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="980" y="800" width="170" height="44" rx="6" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
    <circle cx="998" cy="822" r="10" fill="#374151"/>
    <text x="998" y="826" text-anchor="middle" font-size="11" font-weight="bold" fill="white">6</text>
    <text x="1014" y="818" font-size="11" font-weight="bold" fill="#111827">Evaluation</text>
    <text x="1014" y="833" font-size="10.5" fill="#4B5563">Byzantine attack test</text>
  </g>
